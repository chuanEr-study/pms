server:
  port: 8080

spring:
  application:
    name: pms
  datasource:
    url: jdbc:h2:mem:pms;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# OA 应用凭证（假设：共享静态凭证；必填、启动 fail-fast，由环境变量/配置中心注入）
pms:
  oa:
    app-key: ${OA_APP_KEY:}
    app-secret: ${OA_APP_SECRET:}

logging:
  level:
    com.pms: INFO
